; FM30 network front-end: ESP8266 (Olimex MOD-WIFI-ESP8266-DEV) talking to the
; STM32 controller over UART0 on the swapped pins (GPIO13 RX / GPIO15 TX).
;
;   pio run -t upload            flash firmware over USB serial (GPIO1/GPIO3)
;   pio run -t uploadfs          flash the web UI (data/) to LittleFS
;   pio run -e ota -t upload     flash over WiFi (hostname/password from data/setup.json)
;
; First-time setup: copy setup.example.json to data/setup.json (git-ignored),
; fill it in, and upload the filesystem. The ESP applies it once and deletes it.
;
; Host tests (no hardware): python tools/run_host_tests.py

[platformio]
default_envs = modwifi

[env]
platform = espressif8266@4.2.1
framework = arduino
board = modwifi
; 2 MB flash: ~1 MB sketch area (two ~880 KB OTA slots fit), 256 KB LittleFS
board_build.ldscript = eagle.flash.2m256.ld
board_build.filesystem = littlefs
upload_speed = 460800
; The USB serial port only sees the boot ROM and the first line of our log;
; after Serial.swap() the debug log is on GPIO2 (Serial1), 115200.
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -Wall

[env:modwifi]
upload_port = COM6
monitor_port = COM6

[env:ota]
; Hostname and OTA password come from data/setup.json (FM30_HOST and
; FM30_OTA_PASS override them).
upload_protocol = espota
extra_scripts = pre:tools/pio_ota.py
